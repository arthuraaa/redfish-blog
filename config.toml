baseurl = "http://www.axolol.fr/"
title = "RedFish"
theme = "hugo-coder"
languagecode = "en"
defaultcontentlanguage = "en"

[pagination]
pagerSize = 20

[services]
[services.disqus]
shortname = "yourdiscussshortname"

[markup.highlight]
style = "github-dark"

[params]
  author = "RedFish"
  info = "Cybersecurity Enthusiast and DevOps Explorer"
  description = "RedFish's personal website and cybersecurity journey"
  keywords = "blog,cybersecurity,ctf,devops,personal"
  avatarurl = "images/avatar.jpg"
  # gravatar = "your@email.com"

  faviconSVG = "/img/favicon.svg"
  favicon_32 = "/img/favicon-32x32.png"
  favicon_16 = "/img/favicon-16x16.png"

  since = 2025

  enableTwemoji = true

  colorScheme = "auto"
  hidecolorschemetoggle = false

  # customCSS = ["css/custom.css"]
  # customSCSS = ["scss/custom.scss"]
  # customJS = ["js/custom.js"]

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

