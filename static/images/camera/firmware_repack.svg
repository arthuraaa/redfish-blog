<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 780 700" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="780" height="700" rx="10" fill="#0d1117"/>
  <text x="390" y="34" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">Reconstruction du firmware</text>

  <!-- Firmware bar original -->
  <text x="390" y="62" text-anchor="middle" fill="#8b949e" font-size="12">firmware dumpé (W25Q64BV.BIN)</text>
  <g stroke="#0d1117" stroke-width="2">
    <rect x="90"  y="72" width="120" height="34" fill="#30363d"/>
    <rect x="210" y="72" width="170" height="34" fill="#30363d"/>
    <rect x="380" y="72" width="220" height="34" fill="#bb6609"/>
    <rect x="600" y="72" width="90"  height="34" fill="#30363d"/>
  </g>
  <g fill="#e6edf3" font-size="12" text-anchor="middle">
    <text x="150" y="93">u-boot</text>
    <text x="295" y="93">kernel</text>
    <text x="490" y="93">SquashFS</text>
    <text x="645" y="93">JFFS2</text>
  </g>
  <text x="490" y="124" text-anchor="middle" fill="#f0883e" font-size="11" font-family="ui-monospace, monospace">offset 0x260000 (2490368)</text>

  <!-- arrow 1 -->
  <line x1="390" y1="134" x2="390" y2="168" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="404" y="156" fill="#58a6ff" font-size="12" font-family="ui-monospace, monospace">binwalk -e  (extraction)</text>

  <!-- squashfs-root box -->
  <rect x="150" y="172" width="480" height="86" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="390" y="198" text-anchor="middle" fill="#e6edf3" font-size="14" font-family="ui-monospace, monospace">squashfs-root/</text>
  <text x="390" y="220" text-anchor="middle" fill="#8b949e" font-size="12">✏️ modification de /etc/init.d/rcS</text>
  <text x="390" y="240" text-anchor="middle" fill="#3fb950" font-size="12" font-family="ui-monospace, monospace">#telnetd &amp;  →  telnetd &amp;</text>

  <!-- arrow 2 -->
  <line x1="390" y1="258" x2="390" y2="292" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="404" y="280" fill="#58a6ff" font-size="12" font-family="ui-monospace, monospace">mksquashfs -comp xz</text>

  <!-- new squashfs box -->
  <rect x="210" y="296" width="360" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="390" y="327" text-anchor="middle" fill="#e6edf3" font-size="14" font-family="ui-monospace, monospace">new-squashfs.img</text>

  <!-- arrow 3 -->
  <line x1="390" y1="348" x2="390" y2="382" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="404" y="370" fill="#58a6ff" font-size="12" font-family="ui-monospace, monospace">dd seek=2490368  (réinjection)</text>

  <!-- Firmware bar modified -->
  <g stroke="#0d1117" stroke-width="2">
    <rect x="90"  y="386" width="120" height="34" fill="#30363d"/>
    <rect x="210" y="386" width="170" height="34" fill="#30363d"/>
    <rect x="380" y="386" width="220" height="34" fill="#238636"/>
    <rect x="600" y="386" width="90"  height="34" fill="#30363d"/>
  </g>
  <g fill="#e6edf3" font-size="12" text-anchor="middle">
    <text x="150" y="407">u-boot</text>
    <text x="295" y="407">kernel</text>
    <text x="490" y="407">SquashFS modifié</text>
    <text x="645" y="407">JFFS2</text>
  </g>
  <text x="390" y="442" text-anchor="middle" fill="#8b949e" font-size="12">new-firmware.bin (taille identique : padding via truncate)</text>

  <!-- arrow flash -->
  <line x1="390" y1="456" x2="390" y2="490" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="404" y="478" fill="#58a6ff" font-size="12" font-family="ui-monospace, monospace">flash XGecu T56</text>

  <!-- camera result -->
  <rect x="240" y="494" width="300" height="66" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="390" y="520" text-anchor="middle" fill="#e6edf3" font-size="14">📷 Caméra</text>
  <text x="390" y="544" text-anchor="middle" fill="#3fb950" font-size="13">telnetd actif dès le boot → moyen n°1</text>

  <text x="390" y="608" text-anchor="middle" fill="#8b949e" font-size="11">⚠️ le firmware d'origine refuse toute modification directe (vérification d'intégrité)</text>
  <text x="390" y="628" text-anchor="middle" fill="#8b949e" font-size="11">→ on remplace la partition SquashFS à son offset d'origine</text>
</svg>
